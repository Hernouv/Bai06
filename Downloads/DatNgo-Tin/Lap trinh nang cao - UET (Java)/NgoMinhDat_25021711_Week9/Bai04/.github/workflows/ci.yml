name: CI - Maven Build

# Trigger workflow on push and pull_request events
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Run Maven clean
      - name: Maven Clean
        run: mvn clean

      # Step 4: Run Maven compile
      - name: Maven Compile
        run: mvn compile

      # Step 5: Run Maven test
      - name: Maven Test
        run: mvn test

      # Step 6: Run Maven package
      - name: Maven Package
        run: mvn package

      # Step 7: Upload JAR artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: grade-classifier-jar
          path: target/*.jar
          retention-days: 30

      # Step 8: Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 30
